apply plugin: 'com.android.application'

// Upload keys are process-only inputs and never checked into source control.
def uploadKeys = ['APNA_UPLOAD_STORE_FILE', 'APNA_UPLOAD_STORE_PASSWORD', 'APNA_UPLOAD_KEY_ALIAS', 'APNA_UPLOAD_KEY_PASSWORD']
def hasUploadKey = uploadKeys.every { System.getenv(it) }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !hasUploadKey) {
    throw new GradleException('A private upload signing key is required for a release build.')
}

// A release may load only the owner's production HTTPS customer app.
def previewConfig = file('src/main/assets/capacitor.config.json')
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && previewConfig.exists()) {
    def nativeConfig = new groovy.json.JsonSlurper().parse(previewConfig)
    if (nativeConfig.appId != 'in.apnamart.app' || nativeConfig.appName != 'Apna Mart' ||
        nativeConfig.server?.url != 'https://apna-mart.in' ||
        nativeConfig.server?.cleartext != false || nativeConfig.android?.allowMixedContent != false) {
        throw new GradleException('Sync the explicit production Android configuration before a release build; preview and unapproved origins are forbidden.')
    }
}

android {
    namespace "in.apnamart.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.apnamart.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile file(System.getenv('APNA_UPLOAD_STORE_FILE'))
                storePassword System.getenv('APNA_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('APNA_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('APNA_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'Apna Mart Test'
            resValue 'string', 'title_activity_main', 'Apna Mart Test'
        }
        release {
            if (hasUploadKey) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
